name: publish

# Publishes to npm when a GitHub release is published. Authentication uses npm
# trusted publishing (OIDC) — there is no NPM_TOKEN secret. The trust
# relationship is configured on npmjs.com under the package's Settings tab and
# must name this exact workflow filename (publish.yml).
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for OIDC — without it npm cannot verify the run

    steps:
      - uses: actions/checkout@v4

      # Deliberately no registry-url: it makes setup-node write an .npmrc with
      # _authToken=${NODE_AUTH_TOKEN} and export that variable. A present-but-
      # empty token is still a value, and npm would use it instead of falling
      # back to OIDC. npm defaults to registry.npmjs.org anyway.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Trusted publishing needs a recent npm CLI; the one bundled with Node
      # predates OIDC support. npm 12 requires Node >= 22.22, hence the bump above.
      - name: Upgrade npm
        run: npm install -g npm@latest

      - name: Show toolchain
        run: |
          node --version
          npm --version
          echo "NODE_AUTH_TOKEN is ${NODE_AUTH_TOKEN:+SET (bad — breaks OIDC)}${NODE_AUTH_TOKEN:-unset (good)}"

      - name: Refuse to publish if the tag and package.json disagree
        if: github.event_name == 'release'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(node -p "require('./package.json').version")
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg"
            exit 1
          fi

      # npm rejects republishing an existing version. Skip cleanly instead of
      # failing the run — 0.1.0 was published by hand before this workflow existed.
      - name: Check whether this version is already on npm
        id: exists
        run: |
          v=$(node -p "require('./package.json').version")
          name=$(node -p "require('./package.json').name")
          if npm view "$name@$v" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$name@$v is already published — skipping publish."
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Smoke-test the tarball before publishing
        if: steps.exists.outputs.already == 'false'
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install "$RUNNER_TEMP"/sync667-marginalia-*.tgz
          mkdir -p d && printf '# Hi\n\nbody\n' > d/a.md
          ./node_modules/.bin/marginalia --docs-dir d --output out.html --no-open
          grep -q "Marginalia" out.html

      - name: Publish
        if: steps.exists.outputs.already == 'false'
        run: npm publish --access public
        # No NODE_AUTH_TOKEN here on purpose. An empty value still counts as a
        # value and npm would use it instead of falling back to OIDC.
